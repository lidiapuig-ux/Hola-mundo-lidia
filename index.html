!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>vibe coding session 01 !</title>
<style>
  * { box-sizing: border-box; }
  :root {
    --bg: #26282b;
    --fg: #e8eaec;
    --accent: #8ba3b8;
  }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: "Courier New", Courier, monospace;
  }

  /* Cabecera */
  header {
    text-align: center;
    padding: 5rem 1.5rem 3rem;
    border-bottom: 2px solid var(--accent);
    max-width: 1100px;
    margin: 0 auto;
  }
  header h1 {
    margin: 0;
    font-size: clamp(2rem, 7vw, 4rem);
    font-weight: bold;
    letter-spacing: 0.03em;
    color: var(--accent);
  }
  header p {
    margin: 1rem 0 0;
    font-size: clamp(1rem, 3.5vw, 1.5rem);
    color: var(--fg);
  }

  /* Zona de la foto: rejilla de 3 columnas */
  main {
    max-width: 1100px;
    margin: 0 auto;
    padding: 3rem 1.5rem 4rem;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1.5rem;
  }
  .foto {
    grid-column: span 3;   /* cambia el 3 por 2 si la quieres más estrecha */
    margin: 0;
  }
  .foto img {
    width: 100%;
    height: auto;
    display: block;
    border-radius: 6px;
    border: 2px solid var(--accent);
  }

  @media (max-width: 600px) {
    .grid { grid-template-columns: 1fr; }
    .foto { grid-column: span 1; }
  }
</style>
</head>
<body>

<header>
  <h1>vibe coding session 01 !</h1>
  <p>with Lidia and Constança</p>
</header>

<main>
  <div class="grid">
    <figure class="foto">
      <img src="foto.png" alt="Lidia y Constança en la primera clase de vibe coding">
    </figure>
  </div>
</main>

</body>
</html>
